server.port=8080

# ===== Microsoft Entra ID (igual que producción) =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d682dd0f-c16d-441b-9de9-821ad928a813/v2.0
spring.security.oauth2.resourceserver.jwt.audiences[0]=9310766b-17b5-4bbc-b37c-68ff05fbf500

# ===== Base de datos H2 en memoria (solo para pruebas locales) =====
spring.datasource.url=jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== RabbitMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
# ACK/NACK manual: cada consumer confirma el mensaje a mano (ver Consumers.java)
spring.rabbitmq.listener.simple.acknowledge-mode=manual