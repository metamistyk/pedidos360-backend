server.port=8080

# ===== Microsoft Entra ID (igual que producción) =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d682dd0f-c16d-441b-9de9-821ad928a813/v2.0
spring.security.oauth2.resourceserver.jwt.audiences[0]=9310766b-17b5-4bbc-b37c-68ff05fbf500

# ===== Base de datos H2 en memoria (solo para pruebas locales) =====
spring.datasource.url=jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== RabbitMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
# ACK/NACK manual: cada consumer confirma el mensaje a mano (ver Consumers.java)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# ===== Apache Kafka =====
# Brokers del clúster (docker-compose.kafka.yml). En AWS se define
# KAFKA_BOOTSTRAP_SERVERS con la IP privada de la EC2 de Kafka, p. ej.
#   KAFKA_BOOTSTRAP_SERVERS=172.31.x.x:9092,172.31.x.x:9093,172.31.x.x:9094
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# --- Productor: la key es String; el valor (DTO) viaja como JSON ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# acks=all + idempotencia: el mensaje se confirma cuando lo tienen las réplicas
# en sincronía (min.insync.replicas=2) y un reintento no genera duplicados.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Si Kafka no responde, el envío falla rápido (5 s) en vez de bloquear la petición HTTP.
spring.kafka.producer.properties.max.block.ms=5000

# --- Consumidor: grupo por defecto (cada @KafkaListener puede definir el suyo) ---
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:pedidos360-default}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer evita que un mensaje malformado ("poison pill")
# deje al consumidor en un bucle infinito: el error se maneja en el listener.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.dsy1107.pedidosapi.kafka
# El offset se confirma a mano/por registro tras procesar bien (ver listeners).
spring.kafka.listener.ack-mode=record

# El backend arranca aunque Kafka no esté disponible (se reintenta la conexión).
spring.kafka.admin.fail-fast=false
