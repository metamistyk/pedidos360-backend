# =============================================================================
# Pedidos360 — Clúster Apache Kafka (EP5 + EP6)
#
#   3 nodos ZooKeeper  (zk1, zk2, zk3)      -> ensemble con quórum
#   3 brokers Kafka    (kafka1, kafka2, kafka3)
#   1 Kafka UI                               -> http://localhost:8090
#
# Kafka COMPLEMENTA a RabbitMQ: no lo reemplaza. RabbitMQ sigue en
# docker-compose.cluster.yml (colas, DLQ, ACK manual). Kafka se usa para el
# flujo de eventos de dominio (retención, particiones, consumer groups).
#
# Funciona igual en local y en AWS. Lo único que cambia es la variable
# KAFKA_EXTERNAL_HOST (la dirección con la que el backend alcanza los brokers):
#   - Local (Docker Desktop):   no definirla (por defecto: localhost)
#   - AWS (EC2 de Kafka):       IP PRIVADA de esa EC2 si el backend está en
#                               otra EC2 de la misma VPC, p. ej.
#                               KAFKA_EXTERNAL_HOST=172.31.x.x
#                               (en .env o exportada antes de "docker compose up")
#
# Cómo levantarlo (en la carpeta de este archivo):
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml ps
#
# Verificar el ensemble ZooKeeper (uno debe decir "leader", dos "follower"):
#   docker exec pedidos360-zk1 bash -c "echo srvr | nc localhost 2181 | grep Mode"
#
# Detener sin perder datos:   docker compose -f docker-compose.kafka.yml down
# Borrar TODO (datos incluidos): docker compose -f docker-compose.kafka.yml down -v
#
# Puertos publicados en el host:
#   9092 / 9093 / 9094  brokers (listener EXTERNAL, para el backend)
#   8090                Kafka UI (el 8080 lo usa el backend Spring Boot)
#
# Los topics NO se crean solos (auto.create.topics.enable=false): los crea el
# backend por código (AdminClient) o el script scripts/kafka-crear-topics.*
# con 3 particiones y factor de replicación 3.
#
# Nota de seguridad: Kafka UI y los brokers no llevan autenticación en este
# laboratorio. En AWS, abre esos puertos en el security group SOLO a tu IP
# (y a la IP privada del backend), nunca a 0.0.0.0/0.
# =============================================================================

x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zk1
    - zk2
    - zk3

services:

  # ---------------------------------------------------------------- ZooKeeper
  zk1:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pedidos360-zk1
    hostname: zk1
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - pedidos360_zk1_data:/var/lib/zookeeper/data
      - pedidos360_zk1_log:/var/lib/zookeeper/log

  zk2:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pedidos360-zk2
    hostname: zk2
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - pedidos360_zk2_data:/var/lib/zookeeper/data
      - pedidos360_zk2_log:/var/lib/zookeeper/log

  zk3:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pedidos360-zk3
    hostname: zk3
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - pedidos360_zk3_data:/var/lib/zookeeper/data
      - pedidos360_zk3_log:/var/lib/zookeeper/log

  # ----------------------------------------------------------- Brokers Kafka
  # Dos listeners por broker:
  #   INTERNAL (kafkaN:29092)  -> tráfico entre brokers y Kafka UI (red Docker)
  #   EXTERNAL (host:909N)     -> backend Spring Boot (fuera de Docker)
  kafka1:
    <<: *kafka-comun
    container_name: pedidos360-kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - pedidos360_kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-comun
    container_name: pedidos360-kafka2
    hostname: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - pedidos360_kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-comun
    container_name: pedidos360-kafka3
    hostname: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - pedidos360_kafka3_data:/var/lib/kafka/data

  # ----------------------------------------------------------------- Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zk1:2181,zk2:2181,zk3:2181
      JAVA_OPTS: "-Xms128m -Xmx384m"

volumes:
  pedidos360_zk1_data:
  pedidos360_zk1_log:
  pedidos360_zk2_data:
  pedidos360_zk2_log:
  pedidos360_zk3_data:
  pedidos360_zk3_log:
  pedidos360_kafka1_data:
  pedidos360_kafka2_data:
  pedidos360_kafka3_data:
